name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        id: build
        run: |
          set -o pipefail
          mvn -B package --file pom.xml 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Reportar errores de compilación como anotaciones
        if: steps.build.outcome == 'failure'
        run: |
          grep -E "^\[ERROR\]" build.log | while IFS= read -r line; do
            clean=$(echo "$line" | sed 's/^\[ERROR\] //')
            echo "::error::${clean}"
          done
          echo "El build falló, ver anotaciones arriba."
          exit 1

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DungeonEasyMaker
          path: target/DungeonEasyMaker.jar
