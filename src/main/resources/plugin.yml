name: DungeonEasyMaker
version: 1.0.0
main: net.example.dem.DEMPlugin
api-version: 1.21
author: TuServidor
softdepend: [PlaceholderAPI]

commands:
  dem:
    description: Dungeon Easy Maker - crea áreas, objetivos y loot para tus dungeons.
    usage: |
      /dem area <wand|create|addenter|addleave|remove|list|info|mob>
      /dem objective <watch|reset|status>
      /dem loot <create|addentry|removeentry|list|roll>
      /dem gui
      /dem reload
    permission: dungeoncore.admin
    permission-message: No tienes permiso para usar este comando.

permissions:
  dungeoncore.admin:
    description: Permite administrar Dungeon Easy Maker
    default: op
